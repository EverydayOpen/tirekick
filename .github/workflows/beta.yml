# Tag vX.Y.Z-beta.N -> unsigned (ad-hoc signed) universal build as a GitHub pre-release, for invited testers only
# (PICK §3: never launch publicly unsigned). Gatekeeper blocks it until the tester allows it once.
# Signed, notarized releases (plain vX.Y.Z tags) are release.yml's job.
name: beta

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"]
  workflow_dispatch:   # builds and uploads the zip as an artifact only; nothing is published

permissions:
  contents: write   # gh release create

env:
  APP: Tirekick

defaults:
  run:
    shell: bash

jobs:
  beta:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app && xcodebuild -version

      - name: Build (universal, ad-hoc signed)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF_TYPE" == tag ]] || VERSION="0.0.0-dev"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          brew install xcodegen
          xcodegen generate
          # Hardened runtime off for the ad-hoc signature; release.yml turns it on with Developer ID. Without it macOS
          # still asks for camera and microphone access through the Info.plist descriptions.
          xcodebuild -project Tirekick.xcodeproj -scheme Tirekick -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build/dd \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" ENABLE_HARDENED_RUNTIME=NO \
            MARKETING_VERSION="${VERSION%%-*}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
          mkdir -p build/out && ditto "build/dd/Build/Products/Release/$APP.app" "build/out/$APP.app"
          lipo -archs "build/out/$APP.app/Contents/MacOS/$APP"

      # Same test as release.yml's "Launch smoke test (arm64)". The app runs nothing until the user picks a mode.
      - name: Launch smoke test
        run: |
          "build/out/$APP.app/Contents/MacOS/$APP" & PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then kill "$PID"; echo "$APP launched and stayed up for 10 s"; exit 0; fi
          STATUS=0; wait "$PID" || STATUS=$?
          echo "::error::$APP quit within 10 s of launch (exit status $STATUS)"
          sleep 5
          for F in $(ls -t ~/Library/Logs/DiagnosticReports/"$APP"* 2>/dev/null | head -3); do echo "== $F"; cat "$F"; done
          exit 1

      - name: Zip
        run: ditto -c -k --keepParent "build/out/$APP.app" "build/$APP-$VERSION.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP }}-${{ env.VERSION }}
          path: build/${{ env.APP }}-${{ env.VERSION }}.zip

      - name: Publish pre-release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > build/notes.md <<EOF
          **Unsigned beta for testers.** Tirekick isn't signed with an Apple Developer ID yet, so macOS blocks the first launch.

          1. Download \`$APP-$VERSION.zip\`, double-click it and move **$APP** to Applications.
          2. Right-click (or Control-click) **$APP** › **Open**, then **Open** again. On macOS 15 and later, open it once,
             then go to System Settings › Privacy & Security and click **Open Anyway**.

          Requires macOS 13 or later, Apple silicon or Intel. This beta doesn't update itself; download new betas from
          this page. Please report problems in [Issues](https://github.com/$GITHUB_REPOSITORY/issues), and paste what
          Help › Copy Raw Data copies (the serial is masked) so the checks can be tested against your Mac's output.
          EOF
          gh release create "$GITHUB_REF_NAME" "build/$APP-$VERSION.zip" --prerelease \
            --title "$APP $VERSION (unsigned beta)" --notes-file build/notes.md
